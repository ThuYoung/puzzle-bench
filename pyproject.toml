[project]
name = "hintbench"
version = "0.1.0"
description = "Budgeted-hint evaluation harness: milestone rubrics, attribution, and individualized regret"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "loguru>=0.7.0",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hintbench"]
